[build]
  command = "npm install"
  publish = "frontend"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["frontend/**"]

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/app"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/app"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app"
  status = 200
